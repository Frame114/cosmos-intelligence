name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      COSMOS_TEST_MODE: "true"
      NASA_API_KEY: DEMO_KEY
      DATABASE_URL: postgresql+asyncpg://cosmos_test:cosmos_test_only@localhost:5432/cosmos_test
      COSMOS_TEST_DATABASE_URL: postgresql+asyncpg://cosmos_test:cosmos_test_only@localhost:5432/cosmos_test
    services:
      postgres:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_DB: cosmos_test
          POSTGRES_USER: cosmos_test
          POSTGRES_PASSWORD: cosmos_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmos_test -d cosmos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy app

      - name: Apply migrations to disposable PostgreSQL
        run: alembic -c alembic/alembic.ini upgrade head

      - name: Check migration metadata
        run: alembic -c alembic/alembic.ini check

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
