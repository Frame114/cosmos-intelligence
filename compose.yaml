name: cosmos-intelligence

services:
  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cosmos}
      POSTGRES_USER: ${POSTGRES_USER:-cosmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosmos_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "-c", "alembic/alembic.ini", "upgrade", "head"]
    environment: &app-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cosmos}:${POSTGRES_PASSWORD:-cosmos_local_only}@postgres:5432/${POSTGRES_DB:-cosmos}
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-environment
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-120}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - proxy
      - data
      - outbound
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.mcp.server:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      COSMOS_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-environment
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
      WORKER_SCHEDULES_ENABLED: ${WORKER_SCHEDULES_ENABLED:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - outbound
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=1m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2.11.9-alpine
    user: "10001:10001"
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
      - proxy
    depends_on:
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
      frontend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /config:size=8m,noexec,nosuid,uid=10001,gid=10001,mode=0700
      - /data:size=16m,noexec,nosuid,uid=10001,gid=10001,mode=0700
      - /tmp:size=8m,noexec,nosuid,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *default-logging

networks:
  edge: {}
  proxy:
    internal: true
  data:
    internal: true
  outbound: {}

volumes:
  postgres-data:
